<section class="section page-hero">
  <div class="container">
    <p class="eyebrow" i18n="@@contact.hero.eyebrow">Contact</p>
    <h1 i18n="@@contact.hero.title">Tell us about the project.</h1>
    <p class="lede" i18n="@@contact.hero.lede">
      Send an email or a WhatsApp message — whichever is easier. We reply within a day or two.
    </p>
  </div>
</section>

<section class="section">
  <div class="container contact-grid">
    <a class="contact-card" href="mailto:hello@karaz.dev">
      <span class="eyebrow" i18n="@@contact.email.label">Email</span>
      <span class="contact-value">hello&#64;karaz.dev</span>
      <span class="contact-hint" i18n="@@contact.email.hint">For project briefs and anything detailed.</span>
    </a>
    <a class="contact-card" href="https://wa.me/963000000000" target="_blank" rel="noopener noreferrer">
      <span class="eyebrow" i18n="@@contact.whatsapp.label">WhatsApp</span>
      <span class="contact-value" i18n="@@contact.whatsapp.value">Message us directly</span>
      <span class="contact-hint" i18n="@@contact.whatsapp.hint">Fastest way to reach us.</span>
    </a>
  </div>

  <div class="container location-row">
    <span class="eyebrow" i18n="@@contact.location.label">Based in</span>
    <span i18n="@@contact.location.value">Qara, Syria — working with clients everywhere</span>
  </div>
</section>
